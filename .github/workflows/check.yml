name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cpu-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Check loader formatting
        id: format
        continue-on-error: true
        run: |
          rustfmt --edition 2024 --emit stdout src/weights.rs > /tmp/weights.rs
          diff -u src/weights.rs /tmp/weights.rs
      - uses: actions/upload-artifact@v4
        if: steps.format.outcome == 'failure'
        with:
          name: formatted-weights
          path: /tmp/weights.rs
      - name: CPU tests
        run: cargo test --locked --no-default-features --features cpu
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Require formatting
        if: steps.format.outcome == 'failure'
        run: exit 1

  wgpu:
    name: WGPU compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: wgpu-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo check --locked --no-default-features --features wgpu --lib
