name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cpu-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Check loader formatting
        id: format
        continue-on-error: true
        run: |
          mkdir -p /tmp/formatted
          status=0
          for file in src/weights.rs tests/checkpoint_memory.rs; do
            rustfmt --edition 2024 --emit stdout < "$file" > "/tmp/formatted/$(basename "$file")"
            diff -u "$file" "/tmp/formatted/$(basename "$file")" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: steps.format.outcome == 'failure'
        with:
          name: formatted-weights
          path: /tmp/formatted/
      - name: CPU tests
        run: |
          cargo test --locked --no-default-features --features cpu --lib
          cargo test --locked --no-default-features --features cpu --test checkpoint_memory -- --nocapture
          cargo test --locked --no-default-features --features cpu --doc
      - name: Clippy
        run: cargo clippy --locked --lib --tests
      - name: Require formatting
        if: steps.format.outcome == 'failure'
        run: exit 1

  wgpu:
    name: WGPU compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: wgpu-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo check --locked --no-default-features --features wgpu --lib
